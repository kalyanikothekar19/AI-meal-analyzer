name: meal_analyzer
description: AI-powered meal nutrition analyzer

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Camera & image
  image_picker: ^1.1.2

  # HTTP
  http: ^1.2.1

  # Local storage
  hive_flutter: ^1.1.0

  # UI niceties
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1